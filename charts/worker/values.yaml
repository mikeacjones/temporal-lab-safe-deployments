image:
  repository: k3d-registry.localhost:5050/research-agent
  tag: "latest"

replicas: 1

temporal:
  connectionRef: lab-temporal
  namespace: default

rollout:
  strategy: AllAtOnce

sunset:
  scaledownDelay: 5s
  deleteDelay: 10s

# Per-version autoscaling with KEDA. Requires KEDA in the cluster and
# ScaledObject in the Worker Controller's allowed resources.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetQueueSize: 5
